<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"></link>
<style>
html,body{margin:0;height:100%;}*{box-sizing:border-box;}
.fv:focus-visible{outline:2px solid #4F46E5;outline-offset:2px;border-radius:4px;}
.ph::before{content:"{{";}
.ph::after{content:"}}";}
</style>
</helmet>

<div style="width:100%;height:100vh;background:rgba(15,23,42,0.5);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#0F172A;">
  <div style="width:560px;max-height:88vh;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,0.3);display:flex;flex-direction:column;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #E2E8F0;">
      <div style="font-size:17px;font-weight:700;">Edit quick reply</div>
      <button class="fv" style="width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:#64748B;display:flex;align-items:center;justify-content:center;cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    </div>

    <div style="padding:24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:12.5px;font-weight:600;color:#334155;">Title</label>
        <input class="fv" type="text" value="Refund policy explanation" style="border:1px solid #E2E8F0;border-radius:8px;padding:10px 12px;font-size:14px;color:#0F172A;outline:none;"></input>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:12.5px;font-weight:600;color:#334155;">Category</label>
        <select class="fv" style="border:1px solid #E2E8F0;border-radius:8px;padding:10px 12px;font-size:14px;color:#0F172A;outline:none;background:#fff;">
          <option>Billing</option>
          <option>Account &amp; Access</option>
          <option>Technical</option>
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:12.5px;font-weight:600;color:#334155;">Body</label>
        <div class="fv" tabindex="0" style="border:1px solid #E2E8F0;border-radius:8px;padding:10px 12px;font-size:13.5px;color:#334155;line-height:1.7;min-height:110px;">
          Hi <span class="ph" style="background:#EEF2FF;color:#4F46E5;font-family:monospace;font-size:12px;border-radius:4px;padding:1px 6px;">customer.first_name</span>, refunds for order <span class="ph" style="background:#EEF2FF;color:#4F46E5;font-family:monospace;font-size:12px;border-radius:4px;padding:1px 6px;">ticket.order_id</span> are processed within 5-7 business days back to your original payment method.
        </div>
      </div>
      <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:12px 14px;">
        <div style="font-size:11.5px;font-weight:700;color:#64748B;margin-bottom:8px;">AVAILABLE PLACEHOLDERS</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          <span class="ph" style="background:#fff;border:1px solid #E2E8F0;color:#4F46E5;font-family:monospace;font-size:11.5px;border-radius:6px;padding:4px 8px;">customer.first_name</span>
          <span class="ph" style="background:#fff;border:1px solid #E2E8F0;color:#4F46E5;font-family:monospace;font-size:11.5px;border-radius:6px;padding:4px 8px;">customer.email</span>
          <span class="ph" style="background:#fff;border:1px solid #E2E8F0;color:#4F46E5;font-family:monospace;font-size:11.5px;border-radius:6px;padding:4px 8px;">ticket.id</span>
          <span class="ph" style="background:#fff;border:1px solid #E2E8F0;color:#4F46E5;font-family:monospace;font-size:11.5px;border-radius:6px;padding:4px 8px;">ticket.order_id</span>
          <span class="ph" style="background:#fff;border:1px solid #E2E8F0;color:#4F46E5;font-family:monospace;font-size:11.5px;border-radius:6px;padding:4px 8px;">agent.name</span>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid #E2E8F0;">
      <button class="fv" style="background:#fff;border:1px solid #E2E8F0;color:#334155;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:600;cursor:pointer;">Cancel</button>
      <button class="fv" style="background:#4F46E5;border:none;color:#fff;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;">Save changes</button>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
